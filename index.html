<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clean Stream Player & External Launcher</title>
  
  <!-- Video.js Default Style -->
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      padding: 24px;
    }
    .wrapper {
      width: 100%;
      max-width: 900px;
    }
    .player-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    .video-container {
      width: 100%;
      background: #000;
    }
    .video-js {
      width: 100%;
      height: 480px;
    }
    .controls-panel {
      padding: 20px;
    }
    .controls-panel h2 {
      font-size: 1.25rem;
      margin-bottom: 6px;
    }
    .controls-panel p {
      font-size: 0.875rem;
      color: #94a3b8;
      margin-bottom: 16px;
    }
    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    input[type="text"] {
      flex: 1;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 10px 14px;
      color: #fff;
      font-size: 0.9rem;
    }
    input[type="text"]:focus {
      outline: 2px solid #38bdf8;
    }
    .btn {
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-primary {
      background: #2563eb;
      color: #fff;
    }
    .btn-primary:hover {
      background: #1d4ed8;
    }
    .btn-vlc {
      background: #ea580c;
      color: #fff;
    }
    .btn-vlc:hover {
      background: #c2410c;
    }
    .btn-download {
      background: #334155;
      color: #f8fafc;
    }
    .btn-download:hover {
      background: #475569;
    }
    .external-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      border-top: 1px solid #334155;
      padding-top: 16px;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="player-card">
      <!-- Direct HTML5 Player Area -->
      <div class="video-container">
        <video
          id="custom-player"
          class="video-js vjs-big-play-centered"
          controls
          preload="auto"
          playsinline>
        </video>
      </div>

      <!-- Controls & External Launch -->
      <div class="controls-panel">
        <h2 id="stream-name">Custom Stream</h2>
        <p>No ad-bloated embed servers. Play directly inside the browser or stream to VLC.</p>

        <!-- Change stream dynamically -->
        <div class="input-row">
          <input
            type="text"
            id="stream-url-input"
            placeholder="Paste direct .m3u8 or .mp4 link here..."
            value="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
          />
          <button class="btn btn-primary" onclick="loadNewStream()">Load Player</button>
        </div>

        <!-- External VLC / MPV Actions -->
        <div class="external-actions">
          <a id="vlc-protocol-btn" href="#" class="btn btn-vlc">
            ▶ Open in VLC Player
          </a>
          <button class="btn btn-download" onclick="downloadPlaylistFile()">
            ⬇ Download .M3U (for MPV / VLC)
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Video.js Script -->
  <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

  <script>
    // Initialize VideoJS Player
    const player = videojs('custom-player');

    function updateExternalLinks(url) {
      // 1. Setup VLC Mobile & Desktop deep-link protocol
      const vlcBtn = document.getElementById('vlc-protocol-btn');
      vlcBtn.href = 'vlc://' + url;
    }

    function loadNewStream() {
      const url = document.getElementById('stream-url-input').value.trim();
      if (!url) return;

      // Determine type
      const isHls = url.includes('.m3u8');
      player.src({
        src: url,
        type: isHls ? 'application/x-mpegURL' : 'video/mp4'
      });
      player.play();

      updateExternalLinks(url);
    }

    // Creates an instant playlist file so users can open it directly in MPV or VLC desktop
    function downloadPlaylistFile() {
      const url = document.getElementById('stream-url-input').value.trim();
      if (!url) return;

      const m3uContent = `#EXTM3U\n#EXTINF:-1,Custom Stream\n${url}`;
      const blob = new Blob([m3uContent], { type: 'application/x-mpegurl' });
      const downloadLink = document.createElement('a');

      downloadLink.href = URL.createObjectURL(blob);
      downloadLink.download = 'stream.m3u8';
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);
    }

    // Load initial default stream on page load
    loadNewStream();
  </script>
</body>
</html>
