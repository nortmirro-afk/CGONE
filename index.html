<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CG Desk - Chhattisgarh Exams, Results, Jobs & Syllabus Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-indigo-500 selection:text-white pb-16">

  <!-- Background Glows -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
    <div class="absolute -top-32 -left-32 w-80 h-80 bg-indigo-600/20 rounded-full blur-[100px]"></div>
    <div class="absolute top-1/2 -right-32 w-80 h-80 bg-purple-600/20 rounded-full blur-[100px]"></div>
  </div>

  <!-- Header -->
  <header class="border-b border-slate-800/80 glass sticky top-0 z-50 px-4 py-3">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center font-extrabold text-white shadow-lg shadow-indigo-500/25">
          CG
        </div>
        <div>
          <h1 class="font-bold text-base tracking-tight leading-tight">CG Alert Desk</h1>
          <p class="text-[10px] text-slate-400">SMKV Bastar • CGPSC • Vyapam • PRSU</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span class="inline-flex items-center gap-1.5 text-[11px] px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-medium">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Live
        </span>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-6">
    <!-- Hero Title -->
    <div class="text-center mb-6">
      <h2 class="text-2xl sm:text-4xl font-extrabold text-white tracking-tight">
        Chhattisgarh Education & Career Desk
      </h2>
      <p class="text-xs sm:text-sm text-slate-400 mt-1.5">
        Official syllabi, exam results, timetables, and vacancies in one click.
      </p>
    </div>

    <!-- Live Search -->
    <div class="mb-5">
      <input 
        id="searchInput" 
        type="text" 
        placeholder="Search 'SMKV Bastar', 'Botany NEP', 'Vyapam Teacher', 'Result'..."
        class="w-full px-4 py-3.5 bg-slate-900/90 border border-slate-800 rounded-2xl text-slate-200 placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-xl transition"
        oninput="filterFeed()"
      >
    </div>

    <!-- Category Tabs -->
    <div class="flex gap-2 overflow-x-auto pb-2 mb-4 scrollbar-none text-xs font-semibold">
      <button onclick="setTab('all')" class="tab-btn px-3.5 py-2 rounded-xl bg-indigo-600 text-white whitespace-nowrap shadow-md">All Updates</button>
      <button onclick="setTab('syllabus')" class="tab-btn px-3.5 py-2 rounded-xl bg-slate-900 text-slate-400 border border-slate-800 whitespace-nowrap">📚 Syllabus Bank</button>
      <button onclick="setTab('results')" class="tab-btn px-3.5 py-2 rounded-xl bg-slate-900 text-slate-400 border border-slate-800 whitespace-nowrap">🎓 Results</button>
      <button onclick="setTab('jobs')" class="tab-btn px-3.5 py-2 rounded-xl bg-slate-900 text-slate-400 border border-slate-800 whitespace-nowrap">💼 CG Jobs</button>
      <button onclick="setTab('exams')" class="tab-btn px-3.5 py-2 rounded-xl bg-slate-900 text-slate-400 border border-slate-800 whitespace-nowrap">📅 Exam Dates</button>
      <button onclick="setTab('notices')" class="tab-btn px-3.5 py-2 rounded-xl bg-slate-900 text-slate-400 border border-slate-800 whitespace-nowrap">📢 Notices</button>
      <button onclick="setTab('events')" class="tab-btn px-3.5 py-2 rounded-xl bg-slate-900 text-slate-400 border border-slate-800 whitespace-nowrap">🎪 Events</button>
    </div>

    <!-- Result Counter -->
    <div class="flex items-center justify-between text-xs text-slate-500 mb-3 px-1">
      <span id="counterText">Showing updates</span>
      <span>Direct Official Links</span>
    </div>

    <!-- Feed Cards Container -->
    <div id="feedList" class="space-y-3"></div>
  </main>

  <script>
    // All updates data: add or edit items here directly from your phone
    const DATA = [
      {
        category: 'syllabus',
        source: 'SMKV Bastar',
        title: 'B.Sc (Hons) Botany & Zoology - NEP 2020 FYUP Syllabus (Sem I to IV)',
        date: 'Session 2026-27',
        tag: 'NEP 2020 Scheme',
        badge: 'New',
        linkText: 'Download Syllabus',
        link: 'https://smkvbastar.ac.in/'
      },
      {
        category: 'syllabus',
        source: 'CGPSC',
        title: 'State Service Examination (Prelims & Mains) Detailed Syllabus & Scheme',
        date: 'Updated 2026',
        tag: 'Competitive Syllabus',
        badge: 'Imp',
        linkText: 'Get Syllabus PDF',
        link: 'https://psc.cg.gov.in/'
      },
      {
        category: 'results',
        source: 'SMKV Bastar',
        title: 'July-Dec Semester Examination Results - BA, B.Sc, B.Com 2nd & 4th Sem',
        date: 'Oct 2026',
        tag: 'Degree Result',
        badge: 'New',
        linkText: 'Check Result',
        link: 'https://smkvbastar.ac.in/'
      },
      {
        category: 'jobs',
        source: 'CG Vyapam',
        title: 'Assistant Teacher & Teacher Recruitment 2026 (5,000+ Posts)',
        date: 'Apply by 28 Oct',
        tag: 'Education Dept',
        badge: 'Imp',
        linkText: 'Apply Online',
        link: 'https://vyapamcg.cgstate.gov.in/'
      },
      {
        category: 'exams',
        source: 'SMKV Bastar',
        title: 'Semester & Annual Supplementary Exam Datesheet & Centre List 2026',
        date: 'Exam starts Nov 2026',
        tag: 'Time Table',
        badge: 'New',
        linkText: 'View Timetable',
        link: 'https://smkvbastar.ac.in/'
      },
      {
        category: 'jobs',
        source: 'CGPSC',
        title: 'CGPSC State Service Prelims Exam Notification 2026 (Deputy Collector/DSP)',
        date: 'Apply Online Open',
        tag: 'State PSC',
        badge: 'Imp',
        linkText: 'Notification PDF',
        link: 'https://psc.cg.gov.in/'
      },
      {
        category: 'syllabus',
        source: 'CSVTU Bhilai',
        title: 'B.Tech Computer Science & AI Scheme - 3rd & 4th Year Curriculum',
        date: 'Regulation 2026',
        tag: 'Technical Scheme',
        badge: '',
        linkText: 'Download Syllabus',
        link: 'https://csvtu.ac.in/'
      },
      {
        category: 'results',
        source: 'PRSU Raipur',
        title: 'Revaluation & Retotaling Results Declared for Annual UG Exams',
        date: 'Oct 2026',
        tag: 'Reval Result',
        badge: 'Updated',
        linkText: 'Check Result',
        link: 'https://prsu.ac.in/'
      },
      {
        category: 'notices',
        source: 'SMKV Bastar',
        title: 'Notification regarding Extension of Admission Dates for PG Semester III & V',
        date: 'Oct 2026',
        tag: 'Admission Notice',
        badge: '',
        linkText: 'Read Notice',
        link: 'https://smkvbastar.ac.in/'
      },
      {
        category: 'events',
        source: 'SMKV Bastar',
        title: 'Bastar Innovation Mahakumbh 1.0 & Startup Incubation Expo 2026',
        date: '15-18 Nov 2026',
        tag: 'University Expo',
        badge: 'Event',
        linkText: 'Register / Details',
        link: 'https://smkvbastar.ac.in/'
      }
    ];

    let currentTab = 'all';

    function setTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.className = 'tab-btn px-3.5 py-2 rounded-xl bg-slate-900 text-slate-400 border border-slate-800 whitespace-nowrap';
      });
      event.target.className = 'tab-btn px-3.5 py-2 rounded-xl bg-indigo-600 text-white whitespace-nowrap shadow-md';
      filterFeed();
    }

    function filterFeed() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const container = document.getElementById('feedList');
      container.innerHTML = '';

      const filtered = DATA.filter(item => {
        const matchesTab = currentTab === 'all' || item.category === currentTab;
        const matchesSearch = item.title.toLowerCase().includes(q) || 
                              item.source.toLowerCase().includes(q) ||
                              item.tag.toLowerCase().includes(q);
        return matchesTab && matchesSearch;
      });

      document.getElementById('counterText').innerText = `Showing ${filtered.length} updates`;

      if (filtered.length === 0) {
        container.innerHTML = `<div class="p-8 text-center text-slate-500 text-xs bg-slate-900/40 rounded-2xl border border-slate-800">No updates found for this search.</div>`;
        return;
      }

      filtered.forEach(item => {
        let badgeStyle = 'bg-sky-500/20 text-sky-400 border-sky-500/30';
        if (item.badge === 'New') badgeStyle = 'bg-rose-500/20 text-rose-400 border-rose-500/30';
        if (item.badge === 'Imp') badgeStyle = 'bg-amber-500/20 text-amber-400 border-amber-500/30';
        if (item.badge === 'Event') badgeStyle = 'bg-purple-500/20 text-purple-400 border-purple-500/30';

        const card = document.createElement('div');
        card.className = 'p-4 rounded-2xl bg-slate-900/60 border border-slate-800/80 hover:border-slate-700 transition flex flex-col justify-between gap-3 shadow-lg';
        card.innerHTML = `
          <div>
            <div class="flex items-center gap-2 mb-2 flex-wrap">
              <span class="text-[11px] font-semibold px-2.5 py-0.5 rounded-md bg-slate-800 text-slate-300 border border-slate-700">${item.source}</span>
              <span class="text-[11px] text-slate-400">${item.tag}</span>
              ${item.badge ? `<span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded border ${badgeStyle}">${item.badge}</span>` : ''}
            </div>
            <h3 class="text-sm sm:text-base font-semibold text-slate-100 leading-snug">${item.title}</h3>
            <p class="text-[11px] text-slate-500 mt-1.5 flex items-center gap-2">
              <span>📅 ${item.date}</span>
            </p>
          </div>
          <div class="pt-2 border-t border-slate-800/60 flex justify-end">
            <a href="${item.link}" target="_blank" class="text-xs font-semibold px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white inline-flex items-center gap-1.5 shadow transition">
              ${item.linkText} ↗
            </a>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Initial render
    filterFeed();
  </script>
</body>
</html>
