<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SynapseMax // TUI Streamer</title>
  <!-- HLS.js for playing scraped .m3u8 streams -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg: #0a0a0c;
      --panel: #111216;
      --accent: #00ff9d;
      --text: #e0e0e0;
      --muted: #6c7086;
      --border: #232530;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      padding: 20px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* TUI Top Bar */
    .tui-header {
      border: 1px solid var(--border);
      background: var(--panel);
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tui-title { color: var(--accent); font-weight: bold; }

    .search-box {
      display: flex;
      gap: 10px;
      width: 50%;
    }

    input, select, button {
      background: #000;
      border: 1px solid var(--border);
      color: var(--accent);
      font-family: inherit;
      padding: 6px 12px;
      outline: none;
    }

    input:focus, select:focus { border-color: var(--accent); }
    button { cursor: pointer; font-weight: bold; }
    button:hover { background: var(--accent); color: #000; }

    /* Main Workspace */
    .tui-main {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 15px;
      flex: 1;
      min-height: 0;
    }

    /* Left Panel: Scraper Logs & Sources */
    .tui-sidebar {
      border: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      flex-direction: column;
      padding: 12px;
      overflow-y: auto;
    }

    .section-label {
      font-size: 0.75rem;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      padding-bottom: 5px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .log-output {
      font-size: 0.8rem;
      line-height: 1.5;
      color: #a6adc8;
      flex: 1;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    .log-success { color: var(--accent); }
    .log-warn { color: #f9e2af; }
    .log-err { color: #f38ba8; }

    /* Right Panel: Native Video Player */
    .tui-player-container {
      border: 1px solid var(--border);
      background: #000;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    video {
      width: 100%;
      height: 100%;
      max-height: calc(100vh - 120px);
      outline: none;
    }

    .player-status {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid var(--border);
      padding: 4px 10px;
      font-size: 0.75rem;
      color: var(--accent);
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="tui-header">
    <div class="tui-title">[ SYNAPSE_MAX // TUI_STREAM_v2.0 ]</div>
    <div class="search-box">
      <input type="text" id="tmdbId" placeholder="Enter TMDB ID (e.g. 550)" value="550" />
      <select id="providerSelect">
        <option value="moviebox">Provider: MovieBox Scraper</option>
        <option value="vidsrc">Provider: VidSrc Extractor</option>
        <option value="flixhq">Provider: FlixHQ Direct</option>
      </select>
      <button onclick="runScraper()">[ SCRAPE & PLAY ]</button>
    </div>
  </div>

  <!-- Main TUI Layout -->
  <div class="tui-main">
    <!-- Scraper Terminal Logs -->
    <div class="tui-sidebar">
      <div class="section-label">// EXTRACTOR_LOGS</div>
      <div id="logBox" class="log-output">> System ready.
> Awaiting TMDB ID input...</div>
    </div>

    <!-- Ad-Free Native HLS Player -->
    <div class="tui-player-container">
      <div class="player-status" id="streamBadge">STATUS: IDLE</div>
      <video id="tuiVideo" controls crossorigin="anonymous"></video>
    </div>
  </div>

  <script>
    const logBox = document.getElementById('logBox');
    const video = document.getElementById('tuiVideo');
    const badge = document.getElementById('streamBadge');
    let hls = null;

    function log(msg, type = '') {
      const span = document.createElement('div');
      if (type) span.className = `log-${type}`;
      span.textContent = `> ${msg}`;
      logBox.appendChild(span);
      logBox.scrollTop = logBox.scrollHeight;
    }

    async function runScraper() {
      const tmdbId = document.getElementById('tmdbId').value.trim();
      const provider = document.getElementById('providerSelect').value;

      logBox.innerHTML = '';
      badge.textContent = 'STATUS: SCRAPING...';
      log(`Initializing [${provider.toUpperCase()}] extractor for TMDB:${tmdbId}...`);

      try {
        // 1. In production, replace this with your backend/worker scraper API:
        // const res = await fetch(`https://your-scraper-worker.dev/scrape?tmdbId=${tmdbId}&provider=${provider}`);
        // const data = await res.json();

        // Simulated TUI scraping sequence:
        await new Promise(r => setTimeout(r, 400));
        log(`Fetching metadata from TMDB...`, 'warn');
        await new Promise(r => setTimeout(r, 500));
        log(`Bypassing provider token obfuscation...`);
        await new Promise(r => setTimeout(r, 600));
        log(`Extracted master.m3u8 manifest! (1080p, 720p, 480p)`, 'success');

        // Demo HLS stream (Big Buck Bunny / Sintel test stream)
        const scrapedM3u8Url = 'https://bitdash-a.akamaihd.net/content/sintel/hls/playlist.m3u8';

        loadStream(scrapedM3u8Url);
      } catch (err) {
        log(`Scraper Error: ${err.message}`, 'err');
        badge.textContent = 'STATUS: ERROR';
      }
    }

    function loadStream(m3u8Url) {
      log(`Mounting HLS stream into native player...`);
      badge.textContent = 'STREAM: DIRECT HLS (AD-FREE)';

      if (Hls.isSupported()) {
        if (hls) hls.destroy();
        hls = new Hls();
        hls.loadSource(m3u8Url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function (event, data) {
          log(`Loaded ${data.levels.length} quality levels. Playing...`, 'success');
          video.play();
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = m3u8Url;
        video.play();
      }
    }
  </script>
</body>
</html>
