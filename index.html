<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CG Alert Desk - Chhattisgarh Universities & Govt Exams</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-indigo-500 selection:text-white pb-16">

  <!-- Background Ambience -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
    <div class="absolute -top-32 -left-32 w-80 h-80 bg-indigo-600/20 rounded-full blur-[100px]"></div>
    <div class="absolute top-1/2 -right-32 w-80 h-80 bg-purple-600/20 rounded-full blur-[100px]"></div>
  </div>

  <!-- Header -->
  <header class="border-b border-slate-800/80 glass sticky top-0 z-50 px-4 py-3">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center font-extrabold text-white shadow-lg shadow-indigo-500/25">
          CG
        </div>
        <div>
          <h1 class="font-bold text-base tracking-tight leading-tight">CG Alert Desk</h1>
          <p class="text-[10px] text-slate-400">All Chhattisgarh Universities & Portals</p>
        </div>
      </div>
      <span class="inline-flex items-center gap-1.5 text-[11px] px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-medium">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Edge Live
      </span>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-5">
    
    <!-- 1. UNIVERSITY SWITCHER TOGGLE (Horizontal Scrollable Pills) -->
    <div class="mb-4">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Select University / Board</span>
        <span id="activeUniIndicator" class="text-xs text-indigo-400 font-medium">Showing All</span>
      </div>
      <div class="flex gap-2 overflow-x-auto pb-1 no-scrollbar text-xs font-medium" id="uniSwitchGroup">
        <button onclick="setUniversity('all', this)" class="uni-btn px-3 py-1.5 rounded-lg bg-indigo-600 text-white whitespace-nowrap shadow">All CG</button>
        <button onclick="setUniversity('SMKV Bastar', this)" class="uni-btn px-3 py-1.5 rounded-lg bg-slate-900 text-slate-400 border border-slate-800 whitespace-nowrap hover:text-white">SMKV Bastar</button>
        <button onclick="setUniversity('PRSU Raipur', this)" class="uni-btn px-3 py-1.5 rounded-lg bg-slate-900 text-slate-400 border border-slate-800 whitespace-nowrap hover:text-white">PRSU Raipur</button>
        <button onclick="setUniversity('ABVV Bilaspur', this)" class="uni-btn px-3 py-1.5 rounded-lg bg-slate-900 text-slate-400 border border-slate-800 whitespace-nowrap hover:text-white">ABVV Bilaspur</button>
        <button onclick="setUniversity('CSVTU Bhilai', this)" class="uni-btn px-3 py-1.5 rounded-lg bg-slate-900 text-slate-400 border border-slate-800 whitespace-nowrap hover:text-white">CSVTU Bhilai</button>
        <button onclick="setUniversity('Durg University', this)" class="uni-btn px-3 py-1.5 rounded-lg bg-slate-900 text-slate-400 border border-slate-800 whitespace-nowrap hover:text-white">Durg (HYV)</button>
        <button onclick="setUniversity('Govt Recruitment', this)" class="uni-btn px-3 py-1.5 rounded-lg bg-slate-900 text-slate-400 border border-slate-800 whitespace-nowrap hover:text-white">Vyapam & CGPSC</button>
      </div>
    </div>

    <!-- 2. Live Search -->
    <div class="mb-4">
      <input 
        id="searchInput" 
        type="text" 
        placeholder="Type course, exam, or subject ('Botany', 'B.Sc 2nd Sem', 'Teacher')..."
        class="w-full px-4 py-3 bg-slate-900/90 border border-slate-800 rounded-xl text-slate-200 placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-inner transition"
        oninput="filterFeed()"
      >
    </div>

    <!-- 3. Category Tabs -->
    <div class="flex gap-2 overflow-x-auto pb-2 mb-4 no-scrollbar text-xs font-semibold" id="categoryGroup">
      <button onclick="setTab('all', this)" class="cat-btn px-3.5 py-1.5 rounded-xl bg-slate-800 text-white whitespace-nowrap border border-slate-700">All Updates</button>
      <button onclick="setTab('syllabus', this)" class="cat-btn px-3.5 py-1.5 rounded-xl bg-slate-900 text-slate-400 border border-slate-800 whitespace-nowrap hover:text-slate-200">📚 Syllabus</button>
      <button onclick="setTab('results', this)" class="cat-btn px-3.5 py-1.5 rounded-xl bg-slate-900 text-slate-400 border border-slate-800 whitespace-nowrap hover:text-slate-200">🎓 Results</button>
      <button onclick="setTab('exams', this)" class="cat-btn px-3.5 py-1.5 rounded-xl bg-slate-900 text-slate-400 border border-slate-800 whitespace-nowrap hover:text-slate-200">📅 Exam Dates</button>
      <button onclick="setTab('jobs', this)" class="cat-btn px-3.5 py-1.5 rounded-xl bg-slate-900 text-slate-400 border border-slate-800 whitespace-nowrap hover:text-slate-200">💼 Jobs & Vacancies</button>
      <button onclick="setTab('notices', this)" class="cat-btn px-3.5 py-1.5 rounded-xl bg-slate-900 text-slate-400 border border-slate-800 whitespace-nowrap hover:text-slate-200">📢 Notices</button>
    </div>

    <!-- Counter -->
    <div class="flex items-center justify-between text-xs text-slate-500 mb-3 px-1">
      <span id="counterText">Showing updates</span>
      <span class="text-emerald-400 font-medium">✓ Direct Official Links</span>
    </div>

    <!-- Feed Container -->
    <div id="feedList" class="space-y-3"></div>
  </main>

  <script>
    // All direct links verified for each university/portal
    const DATA = [
      // --- SMKV BASTAR ---
      {
        university: 'SMKV Bastar',
        category: 'syllabus',
        title: 'SMKV UG / PG & NEP 2020 Affiliated Colleges Syllabus Directory',
        date: 'Session 2026-27',
        tag: 'Official Directory',
        badge: 'New',
        linkText: 'Open Syllabus Directory',
        link: 'https://smkvbastar.ac.in/en/page/affilitated-university-syllabus.aspx?tag=Mg==&type=MQ=='
      },
      {
        university: 'SMKV Bastar',
        category: 'syllabus',
        title: 'Bachelor of Laws (LL.B.) 3-Year Curriculum PDF',
        date: 'Academic Regulation',
        tag: 'Direct PDF',
        badge: 'PDF',
        linkText: 'Download PDF',
        link: 'https://www.smkvbastar.ac.in/Admin/Files/Academic/07172023022714_BACHELOR%20OF%20LAWS%20(L.L.B.).pdf'
      },
      {
        university: 'SMKV Bastar',
        category: 'results',
        title: 'SMKV Online Marksheet & Semester Examination Results Portal',
        date: 'Session 2026',
        tag: 'Exam Marks',
        badge: 'Imp',
        linkText: 'Check Marks',
        link: 'https://smkvbastar.in/'
      },
      {
        university: 'SMKV Bastar',
        category: 'exams',
        title: 'SMKV Semester / Annual Exam Forms & Center List Orders',
        date: 'July-Dec Session',
        tag: 'Timetable & Center',
        badge: 'New',
        linkText: 'View Exam Orders',
        link: 'https://smkvbastar.ac.in/en/page/notices-and-circulars.aspx'
      },

      // --- PRSU RAIPUR ---
      {
        university: 'PRSU Raipur',
        category: 'syllabus',
        title: 'PRSU Complete UG / PG & Diploma Syllabus Repository',
        date: 'Session 2026 Onward',
        tag: 'NEP & CBCS',
        badge: 'Updated',
        linkText: 'Open PRSU Syllabus',
        link: 'https://www.prsu.ac.in/sec-administrations/academic/syllabus'
      },
      {
        university: 'PRSU Raipur',
        category: 'results',
        title: 'Pt. Ravishankar Shukla University Annual & Semester Results Portal',
        date: 'Updated Live',
        tag: 'PRSU Results',
        badge: 'Imp',
        linkText: 'Check Results',
        link: 'https://www.prsu.ac.in/'
      },

      // --- ABVV BILASPUR ---
      {
        university: 'ABVV Bilaspur',
        category: 'results',
        title: 'Bilaspur University (ABVV) UG, PG, NEP & Revaluation Results',
        date: '2026 Results',
        tag: 'ABVV Marks',
        badge: 'New',
        linkText: 'Search Result',
        link: 'https://bilaspuruniversity.ac.in/results.php'
      },
      {
        university: 'ABVV Bilaspur',
        category: 'syllabus',
        title: 'ABVV Bilaspur Academic Courses & NEP Syllabus Section',
        date: 'Session 2026',
        tag: 'Academic Scheme',
        badge: '',
        linkText: 'Open ABVV Portal',
        link: 'https://abvv.ac.in/'
      },

      // --- CSVTU BHILAI ---
      {
        university: 'CSVTU Bhilai',
        category: 'syllabus',
        title: 'B.Tech / M.Tech / Diploma Scheme & Syllabus Repository (NEP 2020)',
        date: 'Engineering & Tech',
        tag: 'Technical Scheme',
        badge: 'New',
        linkText: 'Open CSVTU Scheme',
        link: 'https://csvtu.ac.in/ew/scheme/'
      },

      // --- DURG UNIVERSITY (HYV) ---
      {
        university: 'Durg University',
        category: 'syllabus',
        title: 'Hemchand Yadav Vishwavidyalaya (HYV Durg) UG Annual & Sem Syllabus',
        date: 'Active Session',
        tag: 'Durg Syllabus',
        badge: '',
        linkText: 'Open Durg Syllabus',
        link: 'https://www.durguniversity.ac.in/public/index.php/notice/syllabus-ug-annual-exam'
      },

      // --- VYAPAM & CGPSC (RECRUITMENT) ---
      {
        university: 'Govt Recruitment',
        category: 'jobs',
        title: 'CG Vyapam Teacher, Sub-Inspector & State Recruitment Applications',
        date: 'Active Notices',
        tag: 'Vyapam Online',
        badge: 'Imp',
        linkText: 'Apply on Vyapam',
        link: 'https://vyapamcg.cgstate.gov.in/'
      },
      {
        university: 'Govt Recruitment',
        category: 'syllabus',
        title: 'CGPSC State Service Exam Prelims & Mains Syllabus Scheme (Hindi/English)',
        date: 'Official Pattern',
        tag: 'PSC Exam Scheme',
        badge: 'PDF',
        linkText: 'Open CGPSC Portal',
        link: 'https://psc.cg.gov.in/'
      }
    ];

    let currentUniversity = 'all';
    let currentCategory = 'all';

    function setUniversity(uni, btn) {
      currentUniversity = uni;
      document.querySelectorAll('.uni-btn').forEach(b => {
        b.className = 'uni-btn px-3 py-1.5 rounded-lg bg-slate-900 text-slate-400 border border-slate-800 whitespace-nowrap hover:text-white';
      });
      btn.className = 'uni-btn px-3 py-1.5 rounded-lg bg-indigo-600 text-white whitespace-nowrap shadow';
      document.getElementById('activeUniIndicator').innerText = uni === 'all' ? 'Showing All' : `Filter: ${uni}`;
      filterFeed();
    }

    function setTab(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => {
        b.className = 'cat-btn px-3.5 py-1.5 rounded-xl bg-slate-900 text-slate-400 border border-slate-800 whitespace-nowrap hover:text-slate-200';
      });
      btn.className = 'cat-btn px-3.5 py-1.5 rounded-xl bg-slate-800 text-white whitespace-nowrap border border-slate-700 shadow';
      filterFeed();
    }

    function filterFeed() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const container = document.getElementById('feedList');
      container.innerHTML = '';

      const filtered = DATA.filter(item => {
        const matchUni = currentUniversity === 'all' || item.university === currentUniversity;
        const matchCat = currentCategory === 'all' || item.category === currentCategory;
        const matchSearch = item.title.toLowerCase().includes(q) || 
                            item.university.toLowerCase().includes(q) ||
                            item.tag.toLowerCase().includes(q);
        return matchUni && matchCat && matchSearch;
      });

      document.getElementById('counterText').innerText = `Showing ${filtered.length} updates`;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="p-8 text-center text-slate-500 text-xs bg-slate-900/40 rounded-2xl border border-slate-800">
            No updates found for this combination. Try selecting "All CG" or clearing the search.
          </div>
        `;
        return;
      }

      filtered.forEach(item => {
        let badgeStyle = 'bg-sky-500/20 text-sky-400 border-sky-500/30';
        if (item.badge === 'New') badgeStyle = 'bg-rose-500/20 text-rose-400 border-rose-500/30';
        if (item.badge === 'Imp') badgeStyle = 'bg-amber-500/20 text-amber-400 border-amber-500/30';
        if (item.badge === 'PDF') badgeStyle = 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30';

        const card = document.createElement('div');
        card.className = 'p-4 rounded-2xl bg-slate-900/60 border border-slate-800/80 hover:border-slate-700 transition flex flex-col justify-between gap-3 shadow-lg';
        card.innerHTML = `
          <div>
            <div class="flex items-center gap-2 mb-2 flex-wrap">
              <span class="text-[11px] font-semibold px-2.5 py-0.5 rounded-md bg-slate-800 text-slate-200 border border-slate-700">${item.university}</span>
              <span class="text-[11px] text-slate-400">${item.tag}</span>
              ${item.badge ? `<span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded border ${badgeStyle}">${item.badge}</span>` : ''}
            </div>
            <h3 class="text-sm sm:text-base font-semibold text-slate-100 leading-snug">${item.title}</h3>
            <p class="text-[11px] text-slate-500 mt-1.5">
              <span>📅 ${item.date}</span>
            </p>
          </div>
          <div class="pt-2 border-t border-slate-800/60 flex justify-end">
            <a href="${item.link}" target="_blank" class="text-xs font-semibold px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white inline-flex items-center gap-1.5 shadow transition active:scale-95">
              ${item.linkText} ↗
            </a>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Load initial list
    filterFeed();
  </script>
</body>
</html>
