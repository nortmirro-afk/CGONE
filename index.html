<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clean Player (No Embeds)</title>
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b0f19;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      display: flex;
      justify-content: center;
    }
    .container { width: 100%; max-width: 900px; }
    .player-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      overflow: hidden;
    }
    .video-js { width: 100%; height: 460px; background: #000; }
    .content { padding: 20px; }
    h2 { font-size: 1.25rem; margin-bottom: 6px; }
    p { color: #94a3b8; font-size: 0.875rem; margin-bottom: 16px; }
    .input-bar { display: flex; gap: 8px; margin-bottom: 16px; }
    input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
    }
    .btn {
      padding: 10px 18px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-search { background: #2563eb; }
    .btn-vlc { background: #ea580c; }
    .stream-list {
      margin-top: 14px;
      border-top: 1px solid #334155;
      padding-top: 14px;
    }
    .stream-item {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .stream-info { font-size: 0.85rem; }
    .stream-info strong { color: #38bdf8; display: block; margin-bottom: 3px; }
    .action-group { display: flex; gap: 6px; }
  </style>
</head>
<body>

  <div class="container">
    <div class="player-box">
      <!-- Direct HTML5 Player -->
      <video id="site-player" class="video-js vjs-big-play-centered" controls preload="auto" playsinline></video>

      <div class="content">
        <h2>Ad-Free Direct Stream Player</h2>
        <p>Enter an IMDb ID to fetch direct streams with multi-quality and multi-audio support.</p>

        <!-- IMDb Search Input -->
        <div class="input-bar">
          <input type="text" id="imdb-input" placeholder="Enter IMDb ID (e.g., tt0133093)" value="tt0133093" />
          <button class="btn btn-search" onclick="fetchStremioStreams()">Find Streams</button>
        </div>

        <!-- Dynamic Streams will appear here -->
        <div id="stream-results" class="stream-list"></div>
      </div>
    </div>
  </div>

  <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

  <script>
    const player = videojs('site-player');
    let activeStreamUrl = "";

    // Public HTTPS Stremio Addon endpoint
    async function fetchStremioStreams() {
      const imdbId = document.getElementById('imdb-input').value.trim();
      const resultsContainer = document.getElementById('stream-results');
      resultsContainer.innerHTML = "<p>Fetching streams...</p>";

      try {
        // Example public stream resolver endpoint
        const res = await fetch(`https://v3-cinemeta.strem.io/meta/movie/${imdbId}.json`);
        const meta = await res.json();
        const title = meta?.meta?.name || imdbId;

        // Sample direct streams returned by a Stremio addon
        const mockStreams = [
          {
            quality: "1080p Full HD",
            audio: "Multi-Audio (Hindi + English)",
            url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
          },
          {
            quality: "720p HD",
            audio: "Original Audio (English)",
            url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
          }
        ];

        renderStreamList(title, mockStreams);

      } catch (err) {
        resultsContainer.innerHTML = `<p style="color: #ef4444;">Failed to load streams: ${err.message}</p>`;
      }
    }

    function renderStreamList(title, streams) {
      const resultsContainer = document.getElementById('stream-results');
      resultsContainer.innerHTML = `<h3 style="margin-bottom: 10px; font-size: 1rem;">Available Streams for: ${title}</h3>`;

      streams.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'stream-item';
        div.innerHTML = `
          <div class="stream-info">
            <strong>${item.quality}</strong>
            <span>${item.audio}</span>
          </div>
          <div class="action-group">
            <button class="btn btn-search" style="padding: 6px 12px; font-size: 0.8rem;" onclick="playInBrowser('${item.url}')">▶ Play Here</button>
            <button class="btn btn-vlc" style="padding: 6px 12px; font-size: 0.8rem;" onclick="openInVLC('${item.url}')">Open in VLC</button>
          </div>
        `;
        resultsContainer.appendChild(div);
      });

      // Auto-load first stream
      if (streams.length > 0) {
        playInBrowser(streams[0].url);
      }
    }

    function playInBrowser(url) {
      activeStreamUrl = url;
      const isHls = url.includes('.m3u8');
      player.src({
        src: url,
        type: isHls ? 'application/x-mpegURL' : 'video/mp4'
      });
      player.play();
    }

    function openInVLC(url) {
      const targetUrl = url || activeStreamUrl;
      if (!targetUrl) return alert("Select a stream first!");

      const ua = navigator.userAgent || "";
      if (/android/i.test(ua)) {
        const cleanUrl = targetUrl.replace(/^https?:\/\//, '');
        const scheme = targetUrl.startsWith('https') ? 'https' : 'http';
        window.location.href = `intent://${cleanUrl}#Intent;scheme=${scheme};package=org.videolan.vlc;type=video/*;end`;
      } else if (/iPad|iPhone|iPod/.test(ua)) {
        window.location.href = 'vlc-x-callback://x-callback-url/stream?url=' + encodeURIComponent(targetUrl);
      } else {
        window.location.href = 'vlc://' + targetUrl;
      }
    }

    // Load initial
    fetchStremioStreams();
  </script>
</body>
</html>
