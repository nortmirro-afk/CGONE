  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #060913;
    }
    .glass-nav {
      background: rgba(10, 15, 29, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .glass-card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.035) 0%, rgba(255, 255, 255, 0.01) 100%);
      backdrop-filter: blur(12px);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-card:hover {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.02) 100%);
      transform: translateY(-2px);
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-in {
      animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>

            CG

        </div>
        <div>
          <h1 class="font-extrabold text-sm sm:text-base tracking-tight text-white flex items-center gap-2">
            CG 360 Apex <span class="text-[9px] uppercase font-bold tracking-widest px-1.5 py-0.5 rounded bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">Pro</span>
          </h1>
          <p class="text-[10px] text-slate-400 font-medium">Bastar & Chhattisgarh Super Desk</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span class="inline-flex items-center gap-1.5 text-[11px] px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-semibold">

    </div>
  </header>

  <!-- Main View -->

    <!-- MASTER MODULE SWITCHER (The Core Hub) -->

        <span id="activeModuleTitle" class="text-xs text-indigo-400 font-semibold">Academic & Govt Hub</span>
      </div>
      <div class="flex gap-2 overflow-x-auto pb-1.5 no-scrollbar text-xs font-semibold" id="moduleSwitchBar">

        <button onclick="setMasterModule('calculator', this)" class="mod-pill px-4 py-2.5 rounded-xl bg-slate-900/80 text-slate-400 border border-white/5 whitespace-nowrap hover:text-white hover:bg-slate-800">🧮 CGPA Calculator</button>
        <button onclick="setMasterModule('haat', this)" class="mod-pill px-4 py-2.5 rounded-xl bg-slate-900/80 text-slate-400 border border-white/5 whitespace-nowrap hover:text-white hover:bg-slate-800">🌿 Haat Bazaars</button>

              <div>
                <label class="block text-xs font-semibold text-slate-300 mb-2">Enter Cumulative CGPA (e.g. 7.84)</label>
                <input id="cgpaVal" type="number" step="0.01" min="0" max="10" placeholder="Type CGPA (0 - 10)..." class="w-full px-4 py-3.5 bg-slate-900 border border-white/10 rounded-2xl text-white text-base focus:outline-none focus:ring-2 focus:ring-indigo-500" oninput="runCGPACalc()">
              </div>

              <div class="p-5 rounded-2xl bg-white/5 border border-white/10 text-center">
                <span class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Calculated Equivalent Percentage</span>
                <div id="cgpaResult" class="text-3xl sm:text-4xl font-extrabold text-indigo-400 mt-1">0.00 %</div>
                <div id="cgpaDivision" class="text-xs font-semibold text-slate-400 mt-1.5">Awaiting CGPA score</div>
              </div>

              <div class="p-4 rounded-xl bg-slate-900/50 border border-white/5 text-[11px] text-slate-500 leading-relaxed">
                💡 Useful for CGPSC, CG Vyapam, and higher education admission forms requiring converted percentage equivalent.
              </div>
            </div>
          </div>
        `;
      }

      // --- MODULE: HAAT BAZAAR ---
      else if (currentModule === 'haat') {
        const today = new Intl.DateTimeFormat('en-US', { weekday: 'long' }).format(new Date());
        workspace.innerHTML = `
          <div class="space-y-4">
            <div class="p-4 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 text-xs text-emerald-300">
              🌿 <strong>Today is ${today}!</strong> Tribal Haats feature unique forest honey, Mahua syrup, brass crafts, and traditional cuisine.
            </div>
            <div class="space-y-3">
              ${HAAT_DATA.map(h => {
                const isToday = h.day === today;
                return `
                  <div class="p-4.5 rounded-2xl border transition ${isToday ? 'bg-indigo-600/15 border-indigo-500/40 shadow-xl' : 'glass-card border-white/5'}">
                    <div class="flex items-center justify-between mb-2">
                      <span class="font-extrabold text-sm ${isToday ? 'text-indigo-300' : 'text-slate-300'}">${h.day}</span>${isToday ? '<span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-full bg-indigo-500 text-white animate-pulse">Happening Today</span>' : ''}
                    </div>
                    <div class="flex flex-wrap gap-2">
                      ${h.places.map(p => `<span class="text-xs px-3 py-1 rounded-xl bg-white/5 border border-white/10 text-slate-300 font-medium">${p}</span>`).join('')}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      // --- MODULE: BASTAR ART ---
      else if (currentModule === 'art') {
        workspace.innerHTML = `
          <div class="space-y-4">
            <div class="p-4 rounded-2xl bg-amber-500/10 border border-amber-500/20 text-xs text-amber-300">
              🎨 <strong>Direct Artisan Connect:</strong> Tap below to open a pre-filled WhatsApp conversation with verified master artisans without middleman markups.
            </div>
            <div class="grid gap-3.5">
              ${ART_DATA.map(a => `
                <div class="glass-card p-5 rounded-2xl border border-white/5 flex flex-col justify-between gap-4">
                  <div>
                    <div class="flex items-center justify-between">
                      <h4 class="font-extrabold text-white text-base">${a.craft}</h4>
                      <span class="text-[11px] font-semibold text-slate-400">📍 ${a.location}</span>
                    </div>
                    <span class="text-xs text-indigo-400 font-bold block mt-0.5">${a.artisan}</span>
                    <p class="text-xs text-slate-400 mt-2 leading-relaxed">${a.desc}</p>
                  </div>
                  <div class="pt-3 border-t border-white/5 flex justify-end">
                    <a href="https://wa.me/${a.wa}?text=Hello,\%20I\%20am\%20interested\%20in\%20your\%20${encodeURIComponent(a.craft)}" target="_blank" class="px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs inline-flex items-center gap-2 shadow-lg shadow-emerald-600/20 active:scale-95 transition">
                      💬 Connect on WhatsApp
                    </a>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      // --- MODULE: MANDI & PRODUCE RATES ---
      else if (currentModule === 'mandi') {
        workspace.innerHTML = `
          <div class="space-y-5">
            <!-- Produce Rate Cards -->
            <div class="p-4 rounded-2xl bg-amber-500/10 border border-amber-500/20 text-xs text-amber-300">
              🌾 <strong>Government Minimum Support Price (MSP):</strong> Fixed procurement baseline for minor forest produce and millets.
            </div>
            <div class="space-y-3">
              ${MANDI_DATA.map(m => `
                <div class="glass-card p-4 rounded-2xl border border-white/5 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                  <div>
                    <h4 class="font-bold text-sm text-white">${m.produce}</h4>
                    <p class="text-xs text-slate-400">${m.desc}</p>
                  </div>
                  <span class="text-xs font-bold px-3 py-1.5 rounded-xl bg-amber-500/10 text-amber-400 border border-amber-500/20 whitespace-nowrap self-start sm:self-auto">
                    ₹${m.rate}${m.unit}
                  </span>
                </div>
              `).join('')}
            </div>

            <!-- Instant Payout Calculator -->
            <div class="glass-card p-6 rounded-3xl border border-white/5 mt-6">
              <h4 class="font-bold text-sm text-white mb-1">🌾 Produce Payout Estimator</h4>
              <p class="text-xs text-slate-400 mb-4">Calculate estimated payout for your stock based on MSP rate.</p>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
                <div>
                  <label class="text-[11px] font-semibold text-slate-300 block mb-1">Select Crop / Produce</label>
                  <select id="mandiCropSelect" class="w-full bg-slate-900 border border-white/10 rounded-xl px-3 py-2.5 text-xs text-white" onchange="calcMandiPayout()">
                    ${MANDI_DATA.map((m, idx) => `<option value="${idx}">₹${m.rate} -${m.produce}</option>`).join('')}
                  </select>
                </div>
                <div>
                  <label class="text-[11px] font-semibold text-slate-300 block mb-1">Quantity (in Bags or Quintals)</label>
                  <input id="mandiQty" type="number" min="1" value="1" class="w-full bg-slate-900 border border-white/10 rounded-xl px-3 py-2.5 text-xs text-white" oninput="calcMandiPayout()">
                </div>
              </div>
              <div class="p-4 rounded-xl bg-white/5 border border-white/10 text-center">
                <span class="text-xs text-slate-400">Total Fair Estimated Payout:</span>
                <div id="mandiTotalPayout" class="text-2xl font-extrabold text-amber-400 mt-0.5">₹5,500</div>
              </div>
            </div>
          </div>
        `;
      }

      // --- MODULE: STUDENT HOSTELS ---
      else if (currentModule === 'hostel') {
        workspace.innerHTML = `
          <div class="space-y-4">
            <div class="p-4 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 text-xs text-indigo-300">
              🏠 <strong>Verified Student Rooms:</strong> Clean accommodation near SMKV Jagdalpur and PRSU Raipur campuses.
            </div>
            <div class="grid gap-3.5">
              ${HOSTEL_DATA.map(h => `
                <div class="glass-card p-5 rounded-2xl border border-white/5 flex flex-col justify-between gap-3">
                  <div>
                    <h4 class="font-extrabold text-white text-base">${h.name}</h4>
                    <span class="text-xs text-indigo-400 font-semibold block mt-0.5">📍 ${h.location}</span>
                    <p class="text-xs text-slate-300 mt-2 font-medium">💰 Rent: ${h.rent}</p>
                    <p class="text-xs text-slate-400 mt-1">✨ Facilities: ${h.facilities}</p>
                  </div>
                  <div class="pt-3 border-t border-white/5 flex justify-end">
                    <a href="https://wa.me/${h.wa}?text=Hello,\%20inquiring\%20about\%20room\%20availability\%20at\%20${encodeURIComponent(h.name)}" target="_blank" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs inline-flex items-center gap-1.5 shadow active:scale-95 transition">
                      💬 WhatsApp Owner
                    </a>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }
    }

    // ==========================================
    // 3. FILTERING & MATH FUNCTIONS
    // ==========================================

    function setUniFilter(uni, btn) {
      currentUniversity = uni;
      document.querySelectorAll('.uni-pill').forEach(b => {
        b.className = 'uni-pill px-3.5 py-1.5 rounded-xl bg-slate-900/80 text-slate-400 border border-white/5 whitespace-nowrap';
      });
      btn.className = 'uni-pill px-3.5 py-1.5 rounded-xl bg-indigo-600 text-white whitespace-nowrap shadow';
      document.getElementById('activeUniIndicator').innerText = uni === 'all' ? 'All Entities' : uni;
      filterAcademicFeed();
    }

    function setCatFilter(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.cat-pill').forEach(b => {
        b.className = 'cat-pill px-3.5 py-1.5 rounded-xl bg-slate-900/80 text-slate-400 border border-white/5 whitespace-nowrap';
      });
      btn.className = 'cat-pill px-3.5 py-1.5 rounded-xl bg-white/10 text-white border border-white/10 whitespace-nowrap';
      filterAcademicFeed();
    }

    function filterAcademicFeed() {
      const searchEl = document.getElementById('searchInput');
      const q = searchEl ? searchEl.value.toLowerCase() : '';
      const container = document.getElementById('academicFeed');
      if (!container) return;
      container.innerHTML = '';

      const filtered = ACADEMIC_DATA.filter(item => {
        const matchUni = currentUniversity === 'all' || item.university === currentUniversity;
        const matchCat = currentCategory === 'all' || item.category === currentCategory;
        const matchSearch = item.title.toLowerCase().includes(q) || 
                            item.university.toLowerCase().includes(q) ||
                            item.tag.toLowerCase().includes(q);
        return matchUni && matchCat && matchSearch;
      });

      const counterEl = document.getElementById('academicCounter');
      if (counterEl) counterEl.innerText = `${filtered.length} updates found`;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="p-10 text-center bg-slate-900/30 rounded-3xl border border-white/5">
            <p class="text-sm text-slate-400 font-medium">No results match your selection.</p>
            <p class="text-xs text-slate-600 mt-1">Try switching to "All CG" or clearing search keywords.</p>
          </div>
        `;
        return;
      }

      filtered.forEach((item, index) => {
        let badgeColor = 'bg-blue-500/10 text-blue-400 border-blue-500/20';
        if (item.badgeType === 'emerald') badgeColor = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';
        if (item.badgeType === 'purple') badgeColor = 'bg-purple-500/10 text-purple-400 border-purple-500/20';
        if (item.badgeType === 'rose') badgeColor = 'bg-rose-500/10 text-rose-400 border-rose-500/20';

        const card = document.createElement('div');
        card.className = 'glass-card rounded-2xl p-4.5 border border-white/5 hover:border-white/15 flex flex-col sm:flex-row sm:items-center justify-between gap-4 animate-in';
        card.style.animationDelay = `${index * 35}ms`;

        card.innerHTML = `
          <div class="space-y-1.5 flex-1">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="text-[11px] font-bold px-2.5 py-0.5 rounded-lg bg-white/5 border border-white/10 text-slate-300">${item.university}</span>
              <span class="text-[11px] font-medium text-slate-500">${item.tag}</span>
              <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full border ${badgeColor}">${item.badge}</span>
            </div>
            <h3 class="text-sm sm:text-base font-bold text-slate-100 hover:text-white transition leading-snug pt-0.5">${item.title}</h3>
            <p class="text-[11px] text-slate-500 font-medium flex items-center gap-2">
              <span>📅 ${item.date}</span>
            </p>
          </div>
          <div class="pt-2 sm:pt-0 border-t sm:border-0 border-white/5 flex items-center justify-end">
            <a href="${item.link}" target="_blank" class="w-full sm:w-auto text-center text-xs font-bold px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white inline-flex items-center justify-center gap-1.5 shadow-lg shadow-indigo-600/20 active:scale-95 transition">
              <span>${item.linkText}</span>
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </a>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function runCGPACalc() {
      const val = parseFloat(document.getElementById('cgpaVal').value);
      const out = document.getElementById('cgpaResult');
      const div = document.getElementById('cgpaDivision');
      if (!val || isNaN(val) || val <= 0) {
        out.innerText = '0.00 %';
        div.innerText = 'Awaiting CGPA score';
        return;
      }
      const pct = (val * 9.5).toFixed(2);
      out.innerText = `${pct} %`;
      let divisionText = "Second Division";
      if (pct >= 75) divisionText = "First Class with Distinction";
      else if (pct >= 60) divisionText = "First Division";
      else if (pct < 50) divisionText = "Pass Division";
      div.innerText = `Equivalent: ${divisionText}`;
    }

    function calcMandiPayout() {
      const idx = parseInt(document.getElementById('mandiCropSelect').value);
      const qty = parseFloat(document.getElementById('mandiQty').value) || 0;
      const rate = MANDI_DATA[idx].rate;
      const total = qty * rate;
      document.getElementById('mandiTotalPayout').innerText = `₹${total.toLocaleString('en-IN')}`;
    }

    // Initialize Default View on Page Load
    renderActiveModule();
  </script>
</body>
</html>
