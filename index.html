<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Direct Stream Player & Search</title>

  <!-- Video.js Player CSS -->
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container { width: 100%; max-width: 920px; }
    .player-card {
      background: #151d30;
      border: 1px solid #23314e;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
    }
    .player-screen {
      width: 100%;
      height: 480px;
      background: #000;
    }
    .video-js {
      width: 100%;
      height: 100%;
    }
    .content-area { padding: 22px; }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 10px;
    }
    h2 { font-size: 1.3rem; font-weight: 700; color: #fff; }
    .badge {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      color: #38bdf8;
    }
    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    input {
      flex: 1;
      min-width: 220px;
      background: #0b1120;
      border: 1px solid #23314e;
      border-radius: 6px;
      padding: 10px 14px;
      color: #fff;
      font-size: 0.9rem;
    }
    input:focus { outline: 2px solid #38bdf8; }
    .btn {
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      border: none;
      color: #fff;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-primary { background: #2563eb; }
    .btn-vlc { background: #ea580c; }
    .btn-secondary { background: #334155; }
    .results-box {
      border-top: 1px solid #23314e;
      margin-top: 16px;
      padding-top: 16px;
    }
    .stream-item {
      background: #0b1120;
      border: 1px solid #23314e;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .stream-meta { max-width: 65%; }
    .stream-meta strong { color: #38bdf8; display: block; font-size: 0.95rem; margin-bottom: 2px; }
    .stream-meta small { color: #94a3b8; font-size: 0.8rem; }
    .btn-group { display: flex; gap: 8px; }
  </style>
</head>
<body>

  <div class="container">
    <div class="player-card">
      <!-- Direct HTML5 Player (No Embed Iframes) -->
      <div class="player-screen">
        <video id="site-player" class="video-js vjs-big-play-centered" controls preload="auto" playsinline></video>
      </div>

      <div class="content-area">
        <div class="header-row">
          <h2 id="current-title">Direct Media Player</h2>
          <span class="badge">Embed-Free • Native HTML5 & VLC</span>
        </div>

        <!-- Search by Movie Name -->
        <div class="input-row">
          <input 
            type="text" 
            id="search-input" 
            placeholder="Search movie title (e.g., Night of the Living Dead, Sintel, Big Buck Bunny)..." 
            value="Night of the Living Dead"
            onkeydown="if(event.key==='Enter') searchByName()"
          />
          <button class="btn btn-primary" onclick="searchByName()">Search Title</button>
        </div>

        <!-- Custom Direct Stream Input -->
        <div class="input-row">
          <input 
            type="text" 
            id="custom-url" 
            placeholder="Or paste any direct .m3u8 / .mp4 URL here..." 
          />
          <button class="btn btn-secondary" onclick="loadCustomUrl()">Play Direct URL</button>
        </div>

        <!-- Search & Stream Results -->
        <div id="results-container" class="results-box">
          <p style="color: #94a3b8;">Searching catalog...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Video.js Script -->
  <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

  <script>
    const player = videojs('site-player');

    // Search open-access feature films and media by title via Internet Archive API
    async function searchByName() {
      const query = document.getElementById("search-input").value.trim();
      if (!query) return;

      const resultsDiv = document.getElementById("results-container");
      resultsDiv.innerHTML = `<p style="color: #94a3b8;">Searching playable streams for "${query}"...</p>`;

      try {
        const searchUrl = `https://archive.org/advancedsearch.php?q=title:(${encodeURIComponent(query)})+AND+mediatype:(movies)&fl[]=identifier,title,year,description&sort[]=downloads+desc&rows=8&page=1&output=json`;
        const res = await fetch(searchUrl);
        const data = await res.json();
        const docs = data?.response?.docs || [];

        if (docs.length === 0) {
          resultsDiv.innerHTML = `<p style="color: #f59e0b;">No playable open-access streams found for "${query}". Try another title or paste a direct .m3u8/.mp4 link above.</p>`;
          return;
        }

        resultsDiv.innerHTML = `<h3 style="font-size: 0.95rem; margin-bottom: 12px; color: #cbd5e1;">Search Results (Click to Play):</h3>`;

        docs.forEach((doc) => {
          const item = document.createElement("div");
          item.className = "stream-item";
          const year = doc.year ? `(${doc.year})` : "";
          item.innerHTML = `
            <div class="stream-meta">
              <strong>${doc.title} ${year}</strong>
              <small>ID: ${doc.identifier}</small>
            </div>
            <div class="btn-group">
              <button class="btn btn-primary" onclick="resolveArchiveStream('${doc.identifier}', '${ doc.title.replace(/'/g, "\\'") }')">▶ Play on Site</button>
              <button class="btn btn-vlc" onclick="resolveArchiveStream('${doc.identifier}', '${ doc.title.replace(/'/g, "\\'") }', true)">Open in VLC</button>
            </div>
          `;
          resultsDiv.appendChild(item);
        });

        // Auto-load the first result
        resolveArchiveStream(docs[0].identifier, docs[0].title, false);

      } catch (err) {
        resultsDiv.innerHTML = `<p style="color: #ef4444;">Search error: ${err.message}</p>`;
      }
    }

    // Fetches the exact .mp4 file from the item's metadata
    async function resolveArchiveStream(identifier, title, launchInVlc = false) {
      try {
        const metaRes = await fetch(`https://archive.org/metadata/${identifier}`);
        const meta = await metaRes.json();
        const files = meta?.files || [];

        // Find playable MP4 file
        const videoFile = files.find(f => f.name.endsWith(".mp4")) || files.find(f => f.format === "h.264" || f.format === "MPEG4");

        if (!videoFile) {
          alert("No direct MP4 stream available for this entry.");
          return;
        }

        const directUrl = `https://archive.org/download/${identifier}/${encodeURIComponent(videoFile.name)}`;
        document.getElementById("current-title").innerText = title;
        document.getElementById("custom-url").value = directUrl;

        if (launchInVlc) {
          openVLC(directUrl);
        } else {
          playDirectStream(directUrl);
        }
      } catch (err) {
        alert("Failed to load video stream: " + err.message);
      }
    }

    // Play any custom .m3u8 or .mp4 URL
    function loadCustomUrl() {
      const url = document.getElementById("custom-url").value.trim();
      if (!url) return;
      document.getElementById("current-title").innerText = "Custom Direct Stream";
      playDirectStream(url);
    }

    function playDirectStream(url) {
      const isHls = url.includes(".m3u8");
      player.src({
        src: url,
        type: isHls ? "application/x-mpegURL" : "video/mp4"
      });
      player.play().catch(() => {});
    }

    // Launch external VLC player on Android, iOS, or Desktop
    function openVLC(targetUrl) {
      if (!targetUrl) return;
      const ua = navigator.userAgent || "";

      if (/android/i.test(ua)) {
        const cleanUrl = targetUrl.replace(/^https?:\/\//, "");
        const scheme = targetUrl.startsWith("https") ? "https" : "http";
        window.location.href = `intent://${cleanUrl}#Intent;scheme=${scheme};package=org.videolan.vlc;type=video/*;end`;
      } else if (/iPad|iPhone|iPod/.test(ua)) {
        window.location.href = "vlc-x-callback://x-callback-url/stream?url=" + encodeURIComponent(targetUrl);
      } else {
        window.location.href = "vlc://" + targetUrl;
      }
    }

    // Run initial search on load
    searchByName();
  </script>
</body>
</html>
